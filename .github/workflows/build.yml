name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitro
          POSTGRES_PASSWORD: vitro
          POSTGRES_DB: vitro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitro" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://vitro:vitro@localhost:5432/vitro_test
      - run: npm run server:build

  windows:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.rel.outputs.publish }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # A push to main publishes a release when the app version has none yet.
      # Re-running the workflow after adding the signing key adds the update
      # feed to a release that was published without one.
      - name: Decide whether to publish a release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if ! assets=$(gh release view "v$version" --json assets -q '.assets[].name' 2>/dev/null); then
              publish=true
            elif [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && ! echo "$assets" | grep -qx "latest.json"; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish=$publish"
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Building without the update signature; installed apps will not see this build as an update."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Collect files
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/VitroTasks-setup.exe"
          cp src-tauri/target/release/vitro-tasks.exe "out/VitroTasks-portable.exe"
          sig=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -n 1 || true)
          if [ -n "$sig" ]; then
            cp "$sig" "out/VitroTasks-setup.exe.sig"
            # The feed the app reads: releases/latest/download/latest.json
            node scripts/update-feed.mjs "out/VitroTasks-setup.exe.sig" "v${{ steps.rel.outputs.version }}" > out/latest.json
            cat out/latest.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vitro-tasks-windows
          path: out/*
          if-no-files-found: error
      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vitro Tasks ${{ steps.rel.outputs.version }}
          files: out/*
          generate_release_notes: true

  # The sync server's image for every release: servers set up with
  # server/docker-compose.yml update themselves to it.
  server-image:
    needs: [test, windows]
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VITRO_VERSION=${{ needs.windows.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.windows.outputs.version }}
          tags: |
            ghcr.io/pad-mac/vitro-sync:latest
            ghcr.io/pad-mac/vitro-sync:${{ needs.windows.outputs.version }}
      - name: The image can be pulled without signing in
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/pad-mac/vitro-sync:${{ needs.windows.outputs.version }}
          docker run --rm ghcr.io/pad-mac/vitro-sync:${{ needs.windows.outputs.version }} node -e "console.log(process.env.VITRO_VERSION)"

  ios:
    uses: ./.github/workflows/ios.yml

  # Adds the iPhone build and its SideStore source to the release the Windows
  # job just published.
  ios-release:
    needs: [windows, ios]
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitro-tasks-ios
          path: out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.windows.outputs.version }}"
          node scripts/altsource.mjs out/VitroTasks.ipa "$tag" > out/vitro-tasks.altsource.json
          cat out/vitro-tasks.altsource.json
          gh release upload "$tag" out/VitroTasks.ipa out/vitro-tasks.altsource.json --clobber
