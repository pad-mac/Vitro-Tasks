name: iOS

# Builds an unsigned IPA for sideloading (SideStore / AltStore re-sign it with
# your own Apple ID). Called by the main Build workflow; runs on its own for
# manual runs and for pushes to ios-* branches.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["ios-*"]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios
      - name: Widgets compile on their own (fails fast)
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -swift-version 5 \
            -target arm64-apple-ios17.0 ios/widgets/*.swift
      # Branches only: pictures of the widgets from ios/preview/sample.json (rendered on the Mac).
      - name: Widget previews
        if: startsWith(github.ref, 'refs/heads/ios-')
        continue-on-error: true
        run: |
          w=ios/widgets
          xcrun --sdk macosx swiftc -swift-version 5 -D PREVIEW -target arm64-apple-macos14.0 \
            $w/Shared.swift $w/Live.swift $w/Intents.swift $w/ListWidget.swift $w/DayWidget.swift $w/WeekWidget.swift \
            ios/preview/main.swift -o "$RUNNER_TEMP/render"
          "$RUNNER_TEMP/render" ios/preview/sample.json previews
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/ios-')
        continue-on-error: true
        with:
          name: widget-previews
          path: previews
          if-no-files-found: ignore
      - run: npm ci
      - name: Tools
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
      - name: Generate the Xcode project
        run: npx tauri ios init --ci
      - name: Add the widget extension
        run: node scripts/ios-widgets.mjs
      - name: App icon
        run: npx tauri icon src-tauri/icons/ios-icon.png
      - name: Build without signing
        run: npx tauri ios build --no-sign --ci --target aarch64
      - name: Collect the IPA
        run: |
          mkdir out
          ipa=$(find src-tauri/gen/apple/build -name "*.ipa" -print -quit)
          if [ -z "$ipa" ]; then
            echo "::error::no .ipa was produced"; find src-tauri/gen/apple/build -maxdepth 3; exit 1
          fi
          cp "$ipa" out/VitroTasks.ipa
      # The build is unsigned; an ad-hoc signature carries the app group for
      # the app and its widgets, which SideStore reads to set the group up.
      - name: Entitlements for the app group
        working-directory: out
        run: |
          unzip -q VitroTasks.ipa
          app=$(find Payload -maxdepth 1 -name "*.app" -print -quit)
          appex="$app/PlugIns/VitroWidgets.appex"
          if [ ! -d "$appex" ]; then
            echo "::error::the widget extension is missing from the app"; ls -R "$app" | head -40; exit 1
          fi
          codesign --force --sign - --entitlements ../ios/widgets.entitlements "$appex"
          codesign --force --sign - --entitlements ../ios/app.entitlements "$app"
          codesign -d --entitlements - "$appex"
          codesign -d --entitlements - "$app"
          plutil -p "$appex/Info.plist"
          rm VitroTasks.ipa
          zip -qry VitroTasks.ipa Payload
          rm -rf Payload
          unzip -l VitroTasks.ipa | grep -E "\.appex/|Info.plist" | head -20
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: vitro-tasks-ios
          path: out/VitroTasks.ipa
          if-no-files-found: error
